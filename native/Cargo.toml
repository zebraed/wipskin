[package]
name = "wipskin_native"
version = "1.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "wipskin_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310: build ONE binary that works on any CPython >= 3.10 (stable ABI),
# matching Maya 2024 (Py 3.10) through 2026+ (Py 3.11). Without abi3, a wheel
# built against 3.12 wouldn't load in Maya's bundled 3.10/3.11 interpreter.
pyo3 = { version = "0.29.0", features = [
    "abi3-py310",
    "generate-import-lib",
] }
quick-xml = "0.41.0"
